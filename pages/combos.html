<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/cards.css" />
    <link rel="stylesheet" href="../css/filters.css" />

    <link rel="stylesheet" href="../css/pagination.css" />
    <link rel="stylesheet" href="../css/combos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="card_main">
        <div class="card_text">
          <div class="text_in_card">
            Ofertas Imperdíveis para <br />
            sua próxima viagem
          </div>

          <div class="low_text_in_card">
            Descontos exclusivos em passagens, hotéis <br />
            e pacotes
          </div>

          <button class="button_in_card">Explorar Promoções →</button>
        </div>
        <div class="box_in_card">%</div>
        <img
          src="../img/airplane_widget.png"
          class="airplane_icon"
          alt="Aviao"
        />
        <div class="card_img"></div>
      </div>
      <div class="products-area">
        <div id="filter"></div>
        <div class="cards-container" id="cards"></div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="../js/filters.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/combos.js"></script>
  </body>
</html>
