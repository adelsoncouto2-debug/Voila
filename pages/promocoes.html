<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/filters.css" />
    <link rel="stylesheet" href="../css/promocoes.css" />
    <link rel="stylesheet" href="../css/cards.css" />
    <link rel="stylesheet" href="../css/pagination.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="header"></div>

    <main>
      <!-- Banner -->
      <div class="card_main">
        <div class="card_text">
          <p class="text_in_card">
            Promoções Imperdíveis <br />
            para você<span class="text_in_card except">viajar mais</span>
          </p>
          <p class="low_text_in_card">
            Aproveite descontos exclusivos de até <b>60% OFF</b> em
            <br />pacotes de sonhos.
          </p>
        </div>
        <div class="card_img"></div>
      </div>

      <div class="products-area">
        <div id="filter"></div>
        <div class="cards-container" id="cards"></div>
      </div>
      <div class="pagination-dots" id="pagination"></div>
    </main>

    <div id="footer"></div>
    <script src="../js/pagination.js"></script>
    <script src="../js/filters.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/promocoes.js"></script>
  </body>
</html>
