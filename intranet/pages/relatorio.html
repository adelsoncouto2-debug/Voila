<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios Voilà</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />

    <link rel="stylesheet" href="../css/relatorios.css" />
    <link rel="stylesheet" href="../css/index.css" />
  </head>

  <body>
    s
    <div id="header"></div>

    <main class="dashboard-main">
      <section class="report-head">
        <div class="dashboard-title">
          <h1>Relatórios</h1>
          <p id="greeting">Carregando seus relatórios...</p>
        </div>

        <div class="report-toolbar">
          <div class="field">
            <label for="month-select">Mês do relatório</label>
            <select id="month-select" disabled></select>
          </div>

          <button type="button" id="btn-download" class="btn-primary" disabled>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            <span id="btn-download-label">Baixar meu relatório</span>
          </button>
        </div>
      </section>

      <!-- estado de carregamento / erro / vazio -->
      <div
        id="report-status"
        class="report-status"
        role="status"
        aria-live="polite"
      ></div>

      <!-- relatório (fica escondido até os dados chegarem) -->
      <div id="report-content" hidden>
        <div class="kpi-grid" id="kpi-grid"></div>

        <div class="dashboard-grid">
          <section class="dash-card">
            <div class="card-head">
              <h2 class="dash-card-title">Atendimentos por mês</h2>
              <ul class="chart-legend">
                <li><i class="dot dot-served"></i>Atendidos</li>
                <li><i class="dot dot-missed"></i>Não atendidos</li>
              </ul>
            </div>
            <div class="rp-chart" id="chart-attendance"></div>
          </section>

          <section class="dash-card">
            <h2 class="dash-card-title" id="summary-title">Resumo do mês</h2>
            <div class="donut-wrap" id="chart-donut"></div>
            <dl class="stat-list" id="stat-list"></dl>
          </section>
        </div>

        <div class="dashboard-grid dashboard-grid-bottom">
          <section class="dash-card">
            <h2 class="dash-card-title">Evolução da avaliação média</h2>
            <div class="rp-chart" id="chart-rating"></div>
          </section>

          <section class="dash-card">
            <h2 class="dash-card-title" id="stars-title">
              Distribuição das avaliações
            </h2>
            <div class="rp-chart" id="chart-stars"></div>
          </section>
        </div>

        <div class="dashboard-grid">
          <section class="dash-card">
            <h2 class="dash-card-title">Receita gerada por mês</h2>
            <div class="rp-chart" id="chart-revenue"></div>
          </section>

          <section class="dash-card">
            <h2 class="dash-card-title" id="dest-title">
              Destinos mais vendidos
            </h2>
            <ul class="info-list" id="dest-list"></ul>
          </section>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="../js/footer.js"></script>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>
    <script defer src="../js/relatorios.js"></script>
    <script src="../js/header.js">
      fetch("../components/header.html")
    </script>
  </body>
</html>
