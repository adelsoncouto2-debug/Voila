<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard do Gerente - Voilà</title>
    <script>
      if (!sessionStorage.getItem("usuarioLogado")) {
        window.location.replace("../index.html");
      }
    </script>

    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/footer.css" />
    <link rel="stylesheet" href="./css/cards.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="header"></div>

    <main class="dashboard-main">
      <div class="dashboard-title">
        <h1>Dashboard</h1>
        <p>
          Seja bem-vindo(a), <span id="dashUserName">Gerente</span>! Veja o
          desempenho da agência hoje
        </p>
      </div>
      <section class="kpi-grid" id="kpiGrid" aria-label="Indicadores do mês">
      </section>

      <section class="dashboard-grid">
        <div class="dash-card chart-card">
          <h3 class="dash-card-title">Vendas Mensais</h3>
          <div class="chart-wrap" id="revenueChartWrap">
          </div>
        </div>

        <div class="dash-card destinations-card">
          <h3 class="dash-card-title">Destinos mais vendidos</h3>
          <ul class="destinations-list" id="destinationsList"></ul>
        </div>
      </section>

      <section class="dashboard-grid">
        <div class="dash-card chart-card">
          <h3 class="dash-card-title">Volume de reclamações</h3>
          <div class="chart-wrap chart-wrap-bars" id="complaintsChartWrap">
          </div>
        </div>

        <div class="dash-card">
          <h3 class="dash-card-title">Ocupação dos próximos voos</h3>
          <ul class="info-list" id="flightsList"></ul>
        </div>
      </section>

      <section class="dashboard-grid dashboard-grid-bottom">
        <div class="dash-card">
          <h3 class="dash-card-title">Últimos chamados do SAC</h3>
          <ul class="info-list" id="sacList"></ul>
        </div>
        <div class="dash-card">
          <h3 class="dash-card-title">Desempenho do sistema</h3>
          <ul class="info-list" id="systemList"></ul>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script>
      fetch("./components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        })
        .catch((error) => console.error("Erro ao carregar o footer:", error));
    </script>
    <script src="./js/header.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
