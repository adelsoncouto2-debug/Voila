<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/cards_passagens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <!-- ==================== CARD DE VOO ==================== -->
    <article class="flight-card">
      <div
        class="flight-card__header"
        onclick="this.closest('.flight-card').classList.toggle('is-expanded')"
      >
        <div class="flight-card__airline">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxWpy2rQGC4SpvCaLUZ-ku_9N2AHqEkdVF21soYDD-Gw&s=10"
            alt="GOL"
            class="airline-logo"
          />
          <!-- <span class="airline-name">GOL</span>-->
        </div>

        <div class="flight-card__times">
          <div class="time-block">
            <span class="time">05:15</span>
          </div>

          <div class="flight-path">
            <span class="path-label">Direto</span>
            <div class="path-line"></div>
          </div>

          <div class="time-block">
            <span class="time">06:35</span>
          </div>
          <span
            class="duration"
            style="
              margin-left: 30px;
              font-family: &quot;Poppins&quot;, &quot;Outfit&quot;, sans-serif;
            "
            >1h 20m</span
          >
        </div>

        <div class="flight-card__price">
          <span class="price">R$ 645,00</span>
        </div>

        <div class="flight-card__baggage">
          <!-- Mochila / Bolsa -->
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <rect x="5" y="6" width="14" height="14" rx="2" />
            <path d="M9 12h6" />
            <path d="M9 16h6" />
          </svg>

          <!-- Mochila de mão -->
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="6" y="7" width="12" height="13" rx="2" />
            <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
            <path d="M10 12h4" />
            <path d="M10 15h4" />
            <path d="M12 7v13" />
          </svg>

          <!-- Mala para despachar -->
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="5" y="8" width="14" height="12" rx="2" />
            <path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
            <path d="M8 12h8" />
            <path d="M8 16h8" />
            <circle cx="9" cy="18" r="0.8" fill="currentColor" />
            <circle cx="15" cy="18" r="0.8" fill="currentColor" />
          </svg>
        </div>

        <button class="flight-card__toggle" aria-label="Expandir detalhes">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </div>

      <!-- Detalhes (aparece ao expandir) -->
      <div class="flight-card__details">
        <div class="details-top">
          <span class="class">Classe: Econômica</span>
          <span class="flight-number">Voo número: LA3619</span>
          <span class="aircraft">Airbus A320</span>
        </div>

        <div class="details-bottom">
          <div class="info-list">
            <div class="info-item negative">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 6L6 18" />
                <path d="M6 6l12 12" />
              </svg>
              <span>Não permite cancelamento</span>
            </div>
            <div class="info-item positive">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 13l4 4L19 7" />
              </svg>
              <span>Permite escolha de assento</span>
            </div>
          </div>

          <div class="baggage-details">
            <div class="baggage-item">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                <rect x="5" y="6" width="14" height="14" rx="2" />
                <path d="M9 12h6" />
                <path d="M9 16h6" />
              </svg>
              <span>Inclui mochila ou bolsa</span>
            </div>
            <div class="baggage-item">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="6" y="7" width="12" height="13" rx="2" />
                <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
                <path d="M10 12h4" />
                <path d="M10 15h4" />
                <path d="M12 7v13" />
              </svg>
              <span>Inclui mochila de mão</span>
            </div>
            <div class="baggage-item">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="5" y="8" width="14" height="12" rx="2" />
                <path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
                <path d="M8 12h8" />
                <path d="M8 16h8" />
                <circle cx="9" cy="18" r="0.8" fill="currentColor" />
                <circle cx="15" cy="18" r="0.8" fill="currentColor" />
              </svg>
              <span>Inclui bagagem para despache</span>
            </div>
          </div>
        </div>
      </div>
    </article>
  </body>
</html>
