<template id="flight-card-template">
  <article class="flight-card">
    <div class="flight-card__header">
      <div class="flight-card__airline">
        <img class="airline-logo" src="" alt="" />
        <span class="airline-name" data-field="airline"></span>
      </div>

      <div class="flight-card__times">
        <div class="time-block">
          <span class="time" data-field="departure"></span>
        </div>

        <div class="flight-path">
          <span class="path-label" data-field="type"></span>
          <div class="path-line"></div>
          <span class="duration" data-field="duration"></span>
        </div>

        <div class="time-block">
          <span class="time" data-field="arrival"></span>
        </div>
      </div>

      <div class="flight-card__price">
        <span class="price" data-field="price"></span>
      </div>

      <div class="flight-card__baggage">
        <span data-bag-icon="mochila" title="Mochila">🎒</span>
        <span data-bag-icon="mao" title="Bagagem de mão">👜</span>
        <span data-bag-icon="despachada" title="Bagagem despachada">🧳</span>
      </div>

      <button
        class="flight-card__toggle"
        type="button"
        aria-label="Expandir detalhes"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
    </div>

    <div class="flight-card__details">
      <div class="details-top">
        <span data-field="class"></span>
        <span data-field="flight-number"></span>
        <span data-field="aircraft"></span>
      </div>

      <div class="details-bottom">
        <div class="info-list">
          <div class="info-item" data-field="cancellation">
            <svg
              data-icon="positive"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M5 13l4 4L19 7" />
            </svg>
            <svg
              data-icon="negative"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
            <span></span>
          </div>

          <div class="info-item" data-field="seat">
            <svg
              data-icon="positive"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M5 13l4 4L19 7" />
            </svg>
            <svg
              data-icon="negative"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
            <span></span>
          </div>
        </div>

        <div class="baggage-details">
          <div class="baggage-item" data-baggage="mochila">Mochila</div>
          <div class="baggage-item" data-baggage="mao">Bagagem de mão</div>
          <div class="baggage-item" data-baggage="despachada">
            Bagagem despachada
          </div>
        </div>
      </div>
    </div>
  </article>
</template>
